services:
  db:
    image: mysql:8.0
    container_name: greenfield-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: greenfield_institute
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: greenfield-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: greenfield_institute
      DB_USER: root
      DB_PASS: rootpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
